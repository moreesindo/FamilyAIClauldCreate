version: '3.8'

# FamilyAI Docker Compose Configuration (Simplified llama.cpp Edition)
# Core AI services on NVIDIA Jetson Thor: Code + Vision + Speech

services:
  # ===========================================================================
  # LLM Services
  # ===========================================================================

  code-coder:
    image: ghcr.io/ggerganov/llama.cpp:server
    container_name: familyai-code-coder
    runtime: nvidia
    environment:
      - GGUF_MODEL=${CODE_CODER_GGUF:-Qwen3-Coder-30B-A3B-Instruct-Q4_K_M.gguf}
      - CONTEXT_SIZE=${CODE_CODER_MAX_MODEL_LEN:-32768}
      - GPU_LAYERS=${LLAMACPP_GPU_LAYERS:-999}
      - N_PARALLEL=${LLAMACPP_N_PARALLEL:-8}
    volumes:
      - ${GGUF_OUTPUT_DIR:-/home/sindoyang/.cache/familyai/gguf}:/models:ro
    ports:
      - "${CODE_CODER_PORT:-8001}:8000"
    command: >
      --model /models/${CODE_CODER_GGUF:-Qwen3-Coder-30B-A3B-Instruct-Q4_K_M.gguf}
      --host 0.0.0.0
      --port 8000
      --ctx-size ${CODE_CODER_MAX_MODEL_LEN:-32768}
      --n-gpu-layers ${LLAMACPP_GPU_LAYERS:-999}
      --n-parallel ${LLAMACPP_N_PARALLEL:-8}
      --metrics
      --log-format text
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              capabilities: [gpu]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 120s
    networks:
      - familyai
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  ai-assistant:
    image: ghcr.io/ggerganov/llama.cpp:server
    container_name: familyai-ai-assistant
    runtime: nvidia
    environment:
      - GGUF_MODEL=${AI_ASSISTANT_GGUF:-Qwen3-30B-A3B-Instruct-2507-Q4_K_M.gguf}
      - CONTEXT_SIZE=${AI_ASSISTANT_MAX_MODEL_LEN:-32768}
      - GPU_LAYERS=${LLAMACPP_GPU_LAYERS:-999}
      - N_PARALLEL=${LLAMACPP_N_PARALLEL:-8}
    volumes:
      - ${GGUF_OUTPUT_DIR:-/home/sindoyang/.cache/familyai/gguf}:/models:ro
    ports:
      - "${AI_ASSISTANT_PORT:-8002}:8000"
    command: >
      --model /models/${AI_ASSISTANT_GGUF:-Qwen3-30B-A3B-Instruct-2507-Q4_K_M.gguf}
      --host 0.0.0.0
      --port 8000
      --ctx-size ${AI_ASSISTANT_MAX_MODEL_LEN:-32768}
      --n-gpu-layers ${LLAMACPP_GPU_LAYERS:-999}
      --n-parallel ${LLAMACPP_N_PARALLEL:-8}
      --metrics
      --log-format text
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              capabilities: [gpu]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 120s
    networks:
      - familyai
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ===========================================================================
  # Vision Service (LLaVA 1.5)
  # ===========================================================================

  vision:
    image: dustynv/llama.cpp:latest
    container_name: familyai-vision
    runtime: nvidia
    environment:
      - GGUF_MODEL=${VISION_GGUF:-ggml-model-q4_k.gguf}
      - MMPROJ=${VISION_MMPROJ:-mmproj-model-f16.gguf}
      - CONTEXT_SIZE=${VISION_MAX_MODEL_LEN:-16384}
      - GPU_LAYERS=${LLAMACPP_GPU_LAYERS:-999}
      - N_PARALLEL=${LLAMACPP_N_PARALLEL:-4}
    volumes:
      - ${GGUF_OUTPUT_DIR:-/home/sindoyang/.cache/familyai/gguf}:/models:ro
    ports:
      - "${VISION_PORT:-8003}:8000"
    command: >
      llama-mtmd-cli
      --model /models/${VISION_GGUF:-ggml-model-q4_k.gguf}
      --mmproj /models/${VISION_MMPROJ:-mmproj-model-f16.gguf}
      --host 0.0.0.0
      --port 8000
      --ctx-size ${VISION_MAX_MODEL_LEN:-16384}
      --n-gpu-layers ${LLAMACPP_GPU_LAYERS:-999}
      --n-parallel ${LLAMACPP_N_PARALLEL:-4}
      --metrics
      --log-format text
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              capabilities: [gpu]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 120s
    networks:
      - familyai
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ===========================================================================
  # Speech Services
  # ===========================================================================

  whisper:
    build:
      context: ./whisper
      dockerfile: Dockerfile
      args:
        - HTTP_PROXY=${PROXY_URL:-}
        - HTTPS_PROXY=${PROXY_URL:-}
        - http_proxy=${PROXY_URL:-}
        - https_proxy=${PROXY_URL:-}
        - NO_PROXY=${NO_PROXY:-localhost,127.0.0.1,.local}
        - no_proxy=${NO_PROXY:-localhost,127.0.0.1,.local}
    image: familyai/whisper:latest
    container_name: familyai-whisper
    runtime: nvidia
    environment:
      - MODEL=${WHISPER_MODEL:-Systran/faster-whisper-small}
      - LANGUAGE=${WHISPER_LANGUAGE:-auto}
      - HF_HOME=/data/huggingface
    volumes:
      - ${HF_HOME:-/home/sindoyang/.cache/huggingface}:/data/huggingface
      - ./whisper/config.yaml:/app/config.yaml:ro
    ports:
      - "${WHISPER_PORT:-8004}:8000"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              capabilities: [gpu]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    networks:
      - familyai
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  piper:
    build:
      context: ./piper
      dockerfile: Dockerfile
      args:
        - HTTP_PROXY=${PROXY_URL:-}
        - HTTPS_PROXY=${PROXY_URL:-}
        - http_proxy=${PROXY_URL:-}
        - https_proxy=${PROXY_URL:-}
        - NO_PROXY=${NO_PROXY:-localhost,127.0.0.1,.local}
        - no_proxy=${NO_PROXY:-localhost,127.0.0.1,.local}
    image: familyai/piper:latest
    container_name: familyai-piper
    environment:
      - MODEL=${PIPER_MODEL:-en_US-lessac-medium}
      - VOICE=${PIPER_VOICE:-lessac}
    volumes:
      - ./piper/config.yaml:/app/config.yaml:ro
      - piper-models:/models
    ports:
      - "${PIPER_PORT:-8005}:8000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    networks:
      - familyai
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ===========================================================================
  # Optional: Intelligent Routing Gateway (Simplified)
  # ===========================================================================

  gateway:
    build:
      context: ./gateway
      dockerfile: Dockerfile
      args:
        - HTTP_PROXY=${PROXY_URL:-}
        - HTTPS_PROXY=${PROXY_URL:-}
        - http_proxy=${PROXY_URL:-}
        - https_proxy=${PROXY_URL:-}
        - NO_PROXY=${NO_PROXY:-localhost,127.0.0.1,.local}
        - no_proxy=${NO_PROXY:-localhost,127.0.0.1,.local}
    image: familyai/gateway:latest
    container_name: familyai-gateway
    environment:
      - LOG_LEVEL=${GATEWAY_LOG_LEVEL:-INFO}
      - API_AUTH_ENABLED=${API_AUTH_ENABLED:-false}
      - API_KEY=${API_KEY:-}
      - RATE_LIMIT_ENABLED=${RATE_LIMIT_ENABLED:-false}
      - RATE_LIMIT_REQUESTS_PER_MINUTE=${RATE_LIMIT_REQUESTS_PER_MINUTE:-60}
      # Backend service URLs
      - CODE_CODER_URL=http://code-coder:8000
      - AI_ASSISTANT_URL=http://ai-assistant:8000
      - VISION_URL=http://vision:8000
      - WHISPER_URL=http://whisper:8000
      - PIPER_URL=http://piper:8000
    volumes:
      - ./gateway/config.yaml:/app/config.yaml:ro
    ports:
      - "${GATEWAY_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s
    networks:
      - familyai
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    profiles:
      - full

  # ===========================================================================
  # Optional: Web UI (Open WebUI)
  # ===========================================================================

  web-ui:
    image: ghcr.io/open-webui/open-webui:main
    container_name: familyai-webui
    environment:
      - OLLAMA_BASE_URL=http://gateway:8080/v1
      - WEBUI_SECRET_KEY=${WEBUI_SECRET_KEY:-change_this_secret}
      - ENABLE_SIGNUP=${WEBUI_ENABLE_SIGNUP:-true}
      - DEFAULT_USER_ROLE=${WEBUI_DEFAULT_USER_ROLE:-user}
    volumes:
      - ${WEBUI_DATA_DIR:-./data/open-webui}:/app/backend/data
    ports:
      - "${WEBUI_PORT:-3000}:8080"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 45s
    networks:
      - familyai
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    profiles:
      - full

  # ===========================================================================
  # Optional: Monitoring (Prometheus + Grafana)
  # ===========================================================================

  prometheus:
    image: prom/prometheus:latest
    container_name: familyai-prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/usr/share/prometheus/console_libraries'
      - '--web.console.templates=/usr/share/prometheus/consoles'
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/alerts.yaml:/etc/prometheus/alerts.yaml:ro
      - prometheus-data:/prometheus
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"
    networks:
      - familyai
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    profiles:
      - monitoring
      - full

  grafana:
    image: grafana/grafana:latest
    container_name: familyai-grafana
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:-admin}
      - GF_INSTALL_PLUGINS=
    volumes:
      - ./monitoring/grafana-dashboard.json:/etc/grafana/provisioning/dashboards/familyai.json:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "${GRAFANA_PORT:-3001}:3000"
    depends_on:
      - prometheus
    networks:
      - familyai
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    profiles:
      - monitoring
      - full

# =============================================================================
# Networks
# =============================================================================

networks:
  familyai:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.0.0/16

# =============================================================================
# Volumes
# =============================================================================

volumes:
  piper-models:
    driver: local
  prometheus-data:
    driver: local
  grafana-data:
    driver: local
