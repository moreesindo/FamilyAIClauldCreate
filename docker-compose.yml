version: '3.8'

# FamilyAI Docker Compose Configuration (llama.cpp Edition)
# Deploys all AI services on NVIDIA Jetson Thor using llama.cpp

services:
  # ===========================================================================
  # Code Assistant Services (Hot-swappable)
  # ===========================================================================

  code-traditional:
    image: ghcr.io/ggerganov/llama.cpp:server
    container_name: familyai-code-traditional
    runtime: nvidia
    environment:
      - GGUF_MODEL=${CODE_TRADITIONAL_GGUF:-code-traditional-q4-k-m.gguf}
      - CONTEXT_SIZE=${CODE_TRADITIONAL_MAX_MODEL_LEN:-16384}
      - GPU_LAYERS=${LLAMACPP_GPU_LAYERS:-999}
      - N_PARALLEL=${LLAMACPP_N_PARALLEL:-8}
    volumes:
      - ${GGUF_OUTPUT_DIR:-~/.cache/familyai/gguf}:/models:ro
    ports:
      - "${CODE_TRADITIONAL_PORT:-8001}:8000"
    command: >
      --model /models/${CODE_TRADITIONAL_GGUF:-code-traditional-q4-k-m.gguf}
      --host 0.0.0.0
      --port 8000
      --ctx-size ${CODE_TRADITIONAL_MAX_MODEL_LEN:-16384}
      --n-gpu-layers ${LLAMACPP_GPU_LAYERS:-999}
      --n-parallel ${LLAMACPP_N_PARALLEL:-8}
      --metrics
      --log-format text
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              capabilities: [gpu]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 120s
    networks:
      - familyai
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  code-agentic:
    image: ghcr.io/ggerganov/llama.cpp:server
    container_name: familyai-code-agentic
    runtime: nvidia
    environment:
      - GGUF_MODEL=${CODE_AGENTIC_GGUF:-code-agentic-q4-k-m.gguf}
      - CONTEXT_SIZE=${CODE_AGENTIC_MAX_MODEL_LEN:-32768}
      - GPU_LAYERS=${LLAMACPP_GPU_LAYERS:-999}
      - N_PARALLEL=${LLAMACPP_N_PARALLEL:-8}
    volumes:
      - ${GGUF_OUTPUT_DIR:-~/.cache/familyai/gguf}:/models:ro
    ports:
      - "${CODE_AGENTIC_PORT:-8002}:8000"
    command: >
      --model /models/${CODE_AGENTIC_GGUF:-code-agentic-q4-k-m.gguf}
      --host 0.0.0.0
      --port 8000
      --ctx-size ${CODE_AGENTIC_MAX_MODEL_LEN:-32768}
      --n-gpu-layers ${LLAMACPP_GPU_LAYERS:-999}
      --n-parallel ${LLAMACPP_N_PARALLEL:-8}
      --metrics
      --log-format text
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              capabilities: [gpu]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 120s
    networks:
      - familyai
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    profiles:
      - full  # Only start with --profile full

  # ===========================================================================
  # Chat Services (Always Running)
  # ===========================================================================

  chat-advanced:
    image: ghcr.io/ggerganov/llama.cpp:server
    container_name: familyai-chat-advanced
    runtime: nvidia
    environment:
      - GGUF_MODEL=${CHAT_ADVANCED_GGUF:-chat-advanced-q4-k-m.gguf}
      - CONTEXT_SIZE=${CHAT_ADVANCED_MAX_MODEL_LEN:-16384}
      - GPU_LAYERS=${LLAMACPP_GPU_LAYERS:-999}
      - N_PARALLEL=${LLAMACPP_N_PARALLEL:-8}
    volumes:
      - ${GGUF_OUTPUT_DIR:-~/.cache/familyai/gguf}:/models:ro
    ports:
      - "${CHAT_ADVANCED_PORT:-8003}:8000"
    command: >
      --model /models/${CHAT_ADVANCED_GGUF:-chat-advanced-q4-k-m.gguf}
      --host 0.0.0.0
      --port 8000
      --ctx-size ${CHAT_ADVANCED_MAX_MODEL_LEN:-16384}
      --n-gpu-layers ${LLAMACPP_GPU_LAYERS:-999}
      --n-parallel ${LLAMACPP_N_PARALLEL:-8}
      --metrics
      --log-format text
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              capabilities: [gpu]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 120s
    networks:
      - familyai
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  chat-fast:
    image: ghcr.io/ggerganov/llama.cpp:server
    container_name: familyai-chat-fast
    runtime: nvidia
    environment:
      - GGUF_MODEL=${CHAT_FAST_GGUF:-chat-fast-q4-k-m.gguf}
      - CONTEXT_SIZE=${CHAT_FAST_MAX_MODEL_LEN:-16384}
      - GPU_LAYERS=${LLAMACPP_GPU_LAYERS:-999}
      - N_PARALLEL=${LLAMACPP_N_PARALLEL:-8}
    volumes:
      - ${GGUF_OUTPUT_DIR:-~/.cache/familyai/gguf}:/models:ro
    ports:
      - "${CHAT_FAST_PORT:-8004}:8000"
    command: >
      --model /models/${CHAT_FAST_GGUF:-chat-fast-q4-k-m.gguf}
      --host 0.0.0.0
      --port 8000
      --ctx-size ${CHAT_FAST_MAX_MODEL_LEN:-16384}
      --n-gpu-layers ${LLAMACPP_GPU_LAYERS:-999}
      --n-parallel ${LLAMACPP_N_PARALLEL:-8}
      --metrics
      --log-format text
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              capabilities: [gpu]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 120s
    networks:
      - familyai
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  chat-light:
    image: ghcr.io/ggerganov/llama.cpp:server
    container_name: familyai-chat-light
    runtime: nvidia
    environment:
      - GGUF_MODEL=${CHAT_LIGHT_GGUF:-chat-light-q4-k-m.gguf}
      - CONTEXT_SIZE=${CHAT_LIGHT_MAX_MODEL_LEN:-8192}
      - GPU_LAYERS=${LLAMACPP_GPU_LAYERS:-999}
      - N_PARALLEL=${LLAMACPP_N_PARALLEL:-8}
    volumes:
      - ${GGUF_OUTPUT_DIR:-~/.cache/familyai/gguf}:/models:ro
    ports:
      - "${CHAT_LIGHT_PORT:-8005}:8000"
    command: >
      --model /models/${CHAT_LIGHT_GGUF:-chat-light-q4-k-m.gguf}
      --host 0.0.0.0
      --port 8000
      --ctx-size ${CHAT_LIGHT_MAX_MODEL_LEN:-8192}
      --n-gpu-layers ${LLAMACPP_GPU_LAYERS:-999}
      --n-parallel ${LLAMACPP_N_PARALLEL:-12}
      --metrics
      --log-format text
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              capabilities: [gpu]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 120s
    networks:
      - familyai
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ===========================================================================
  # Vision Service (llava)
  # ===========================================================================

  vision:
    image: ghcr.io/ggerganov/llama.cpp:server
    container_name: familyai-vision
    runtime: nvidia
    environment:
      - GGUF_MODEL=${VISION_GGUF:-vision-q4-k-m.gguf}
      - CONTEXT_SIZE=${VISION_MAX_MODEL_LEN:-16384}
      - GPU_LAYERS=${LLAMACPP_GPU_LAYERS:-999}
      - N_PARALLEL=${LLAMACPP_N_PARALLEL:-4}
    volumes:
      - ${GGUF_OUTPUT_DIR:-~/.cache/familyai/gguf}:/models:ro
    ports:
      - "${VISION_PORT:-8006}:8000"
    command: >
      --model /models/${VISION_GGUF:-vision-q4-k-m.gguf}
      --host 0.0.0.0
      --port 8000
      --ctx-size ${VISION_MAX_MODEL_LEN:-16384}
      --n-gpu-layers ${LLAMACPP_GPU_LAYERS:-999}
      --n-parallel ${LLAMACPP_N_PARALLEL:-4}
      --metrics
      --log-format text
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              capabilities: [gpu]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 120s
    networks:
      - familyai
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ===========================================================================
  # Speech Services (Unchanged)
  # ===========================================================================

  whisper:
    build:
      context: ./whisper
      dockerfile: Dockerfile
      args:
        - HTTP_PROXY=${PROXY_URL:-}
        - HTTPS_PROXY=${PROXY_URL:-}
        - http_proxy=${PROXY_URL:-}
        - https_proxy=${PROXY_URL:-}
        - NO_PROXY=${NO_PROXY:-localhost,127.0.0.1,.local}
        - no_proxy=${NO_PROXY:-localhost,127.0.0.1,.local}
    image: familyai/whisper:latest
    container_name: familyai-whisper
    runtime: nvidia
    environment:
      - MODEL=${WHISPER_MODEL:-Systran/faster-whisper-small}
      - LANGUAGE=${WHISPER_LANGUAGE:-auto}
      - HF_HOME=/data/huggingface
    volumes:
      - ${HF_HOME:-~/.cache/huggingface}:/data/huggingface
      - ./whisper/config.yaml:/app/config.yaml:ro
    ports:
      - "${WHISPER_PORT:-8007}:8000"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              capabilities: [gpu]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    networks:
      - familyai
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  piper:
    build:
      context: ./piper
      dockerfile: Dockerfile
      args:
        - HTTP_PROXY=${PROXY_URL:-}
        - HTTPS_PROXY=${PROXY_URL:-}
        - http_proxy=${PROXY_URL:-}
        - https_proxy=${PROXY_URL:-}
        - NO_PROXY=${NO_PROXY:-localhost,127.0.0.1,.local}
        - no_proxy=${NO_PROXY:-localhost,127.0.0.1,.local}
    image: familyai/piper:latest
    container_name: familyai-piper
    environment:
      - MODEL=${PIPER_MODEL:-en_US-lessac-medium}
      - VOICE=${PIPER_VOICE:-lessac}
    volumes:
      - ./piper/config.yaml:/app/config.yaml:ro
      - piper-models:/models
    ports:
      - "${PIPER_PORT:-8008}:8000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    networks:
      - familyai
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ===========================================================================
  # Intelligent Routing Gateway (Unchanged)
  # ===========================================================================

  gateway:
    build:
      context: ./gateway
      dockerfile: Dockerfile
      args:
        - HTTP_PROXY=${PROXY_URL:-}
        - HTTPS_PROXY=${PROXY_URL:-}
        - http_proxy=${PROXY_URL:-}
        - https_proxy=${PROXY_URL:-}
        - NO_PROXY=${NO_PROXY:-localhost,127.0.0.1,.local}
        - no_proxy=${NO_PROXY:-localhost,127.0.0.1,.local}
    image: familyai/gateway:latest
    container_name: familyai-gateway
    environment:
      - LOG_LEVEL=${GATEWAY_LOG_LEVEL:-INFO}
      - CODE_CONTEXT_THRESHOLD=${GATEWAY_CODE_CONTEXT_THRESHOLD:-8192}
      - CHAT_SIMPLE_MAX_TOKENS=${GATEWAY_CHAT_SIMPLE_MAX_TOKENS:-100}
      - CHAT_COMPLEX_MIN_TOKENS=${GATEWAY_CHAT_COMPLEX_MIN_TOKENS:-500}
      - API_AUTH_ENABLED=${API_AUTH_ENABLED:-false}
      - API_KEY=${API_KEY:-}
      - RATE_LIMIT_ENABLED=${RATE_LIMIT_ENABLED:-false}
      - RATE_LIMIT_REQUESTS_PER_MINUTE=${RATE_LIMIT_REQUESTS_PER_MINUTE:-60}
      # Backend service URLs
      - CODE_TRADITIONAL_URL=http://code-traditional:8000
      - CODE_AGENTIC_URL=http://code-agentic:8000
      - CHAT_ADVANCED_URL=http://chat-advanced:8000
      - CHAT_FAST_URL=http://chat-fast:8000
      - CHAT_LIGHT_URL=http://chat-light:8000
      - VISION_URL=http://vision:8000
      - WHISPER_URL=http://whisper:8000
      - PIPER_URL=http://piper:8000
    volumes:
      - ./gateway/config.yaml:/app/config.yaml:ro
    ports:
      - "${GATEWAY_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s
    networks:
      - familyai
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ===========================================================================
  # Web UI (Open WebUI) (Unchanged)
  # ===========================================================================

  web-ui:
    image: ghcr.io/open-webui/open-webui:main
    container_name: familyai-webui
    environment:
      - OLLAMA_BASE_URL=http://gateway:8080/v1
      - WEBUI_SECRET_KEY=${WEBUI_SECRET_KEY:-change_this_secret}
      - ENABLE_SIGNUP=${WEBUI_ENABLE_SIGNUP:-true}
      - DEFAULT_USER_ROLE=${WEBUI_DEFAULT_USER_ROLE:-user}
    volumes:
      - ${WEBUI_DATA_DIR:-./data/open-webui}:/app/backend/data
      - ./web-ui/config.json:/app/config.json:ro
    ports:
      - "${WEBUI_PORT:-3000}:8080"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 45s
    networks:
      - familyai
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ===========================================================================
  # Monitoring: Prometheus (Unchanged)
  # ===========================================================================

  prometheus:
    image: prom/prometheus:latest
    container_name: familyai-prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/usr/share/prometheus/console_libraries'
      - '--web.console.templates=/usr/share/prometheus/consoles'
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/alerts.yaml:/etc/prometheus/alerts.yaml:ro
      - prometheus-data:/prometheus
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"
    networks:
      - familyai
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    profiles:
      - monitoring
      - full

  # ===========================================================================
  # Monitoring: Grafana (Unchanged)
  # ===========================================================================

  grafana:
    image: grafana/grafana:latest
    container_name: familyai-grafana
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:-admin}
      - GF_INSTALL_PLUGINS=
    volumes:
      - ./monitoring/grafana-dashboard.json:/etc/grafana/provisioning/dashboards/familyai.json:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "${GRAFANA_PORT:-3001}:3000"
    depends_on:
      - prometheus
    networks:
      - familyai
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    profiles:
      - monitoring
      - full

# =============================================================================
# Networks
# =============================================================================

networks:
  familyai:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.0.0/16

# =============================================================================
# Volumes
# =============================================================================

volumes:
  piper-models:
    driver: local
  prometheus-data:
    driver: local
  grafana-data:
    driver: local
